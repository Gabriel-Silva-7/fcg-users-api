apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: users}
  template:
    metadata:
      labels: {app: users, app.kubernetes.io/part-of: fcg}
      annotations:
        io.fcg.source-sha: ${SOURCE_SHA}
        io.fcg.render-revision: ${RENDER_REVISION}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: users
          image: ${IMAGE}
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: ${CONFIG_NAME}}
            - secretRef: {name: ${SECRET_NAME}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 3
            timeoutSeconds: 5
          volumeMounts:
            - {name: jwt, mountPath: /run/secrets, readOnly: true}
      volumes:
        - name: jwt
          secret:
            secretName: ${KEYS_SECRET_NAME}
            defaultMode: 292
            items:
              - {key: public.pem, path: public.pem}
              - {key: private.pem, path: private.pem}
