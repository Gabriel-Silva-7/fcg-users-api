# Source template only; render private values through fcg-orchestration.
apiVersion: v1
kind: Secret
metadata:
  name: ${SECRET_NAME}
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  ConnectionStrings__Default: ${CONNECTION_STRING}
  RabbitMq__Username: ${MQ_USER}
  RabbitMq__Password: ${MQ_PASSWORD}
  AdminBootstrap__Email: ${BOOTSTRAP_EMAIL}
  AdminBootstrap__Password: ${BOOTSTRAP_PASSWORD}
  AdminBootstrap__PlayerEmail: ${BOOTSTRAP_PLAYER_EMAIL}
  AdminBootstrap__PlayerPassword: ${BOOTSTRAP_PLAYER_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: ${KEYS_SECRET_NAME}
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  public.pem: ${PUBLIC_KEY_PEM}
  private.pem: ${PRIVATE_KEY_PEM}
